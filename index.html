<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misi Analisis Kesalahan: Fungsi Komposisi</title>
  
  <!-- KaTeX for beautiful math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    /* Google Fonts Import */
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,300..700;1,300..700&family=Google+Sans+Code:ital,wght,MONO@0,300..700,0..1;1,300..700,0..1&display=swap');

    /* Core Design Tokens */
    :root {
      --ff-sans: 'Google Sans Flex', sans-serif;
      --ff-mono: 'Google Sans Code', monospace;
      --surface: #fdfcfc;
      --surface-dim: #f2f0f0;
      --surface-bright: #ffffff;
      --surface-container: #f2f0f0;
      --surface-container-high: #e6e6e6;
      --on-surface: #000000;
      --on-surface-variant: rgba(0, 0, 0, 0.55);
      --primary: #3186ff;
      --primary-container: #dcf1ff;
      --accent-fixed: #3186ff;
      --positive: #008052;
      --positive-container: #daf9d4;
      --error: #de2d29;
      --error-container: #ffdeec;
      --outline: #727676;
      --stroke-default: #e3e3e3;
      
      --spacing-xs: 4px;
      --spacing-s: 8px;
      --spacing-m: 12px;
      --spacing-l: 16px;
      --spacing-xl: 20px;
      --r-s: 8px;
      --r-m: 12px;
      --r-full: 999px;
    }

    /* Base Layout */
    html, body {
      margin: 0;
      padding: 0;
      font-family: var(--ff-sans);
      background: var(--surface);
      color: var(--on-surface);
      -webkit-font-smoothing: antialiased;
    }

    .widget-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Components */
    .header-card {
      background: var(--surface-dim);
      border-radius: var(--r-m);
      padding: var(--spacing-l);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-s);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-m);
    }

    .step-badge, .score-badge {
      font-family: var(--ff-mono);
      font-size: 13px;
      padding: 4px 10px;
      border-radius: var(--r-full);
      white-space: nowrap;
    }

    .step-badge {
      background: var(--primary-container);
      color: var(--accent-fixed);
      font-weight: 600;
    }

    .score-badge {
      background: var(--surface-bright);
      border: 1px solid var(--stroke-default);
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--surface-container-high);
      border-radius: var(--r-full);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .problem-box {
      background: var(--surface-container);
      border-radius: var(--r-s);
      padding: var(--spacing-m) var(--spacing-l);
      font-size: 15px;
      line-height: 1.6;
    }

    .scratchpad-card {
      background: var(--surface-bright);
      border: 1px dashed var(--outline);
      border-radius: var(--r-m);
      padding: var(--spacing-l);
      margin-block: var(--spacing-s);
    }

    .scratchpad-title {
      font-family: var(--ff-mono);
      font-size: 13px;
      color: var(--on-surface-variant);
      margin-bottom: var(--spacing-m);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .math-text {
      font-size: 15px;
      line-height: 1.7;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-s);
      margin-top: var(--spacing-l);
    }

    .option-card {
      background: var(--surface-bright);
      border: 1px solid var(--stroke-default);
      border-radius: var(--r-m);
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-m);
      transition: all 0.15s ease;
      user-select: none;
    }

    .option-card:hover { background: var(--surface-container-high); }
    .option-card.is-selected { border-color: var(--primary); background: var(--primary-container); }
    .option-card.is-correct { border-color: var(--positive); background: var(--positive-container); }
    .option-card.is-wrong { border-color: var(--error); background: var(--error-container); }

    .option-radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--outline);
      margin-top: 2px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .option-card.is-selected .option-radio {
      border-color: var(--accent-fixed);
      background: var(--accent-fixed);
    }

    .option-radio::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--surface-bright);
      display: none;
    }

    .option-card.is-selected .option-radio::after { display: block; }

    .explanation-card {
      background: var(--surface-dim);
      border-left: 4px solid var(--primary);
      border-radius: 0 var(--r-m) var(--r-m) 0;
      padding: var(--spacing-l);
      margin-top: var(--spacing-l);
      display: none;
    }

    .explanation-card.is-visible { display: block; }

    .nav-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--spacing-m);
      margin-top: var(--spacing-xl);
    }

    .lumi-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 20px;
      font-family: var(--ff-sans);
      font-size: 14px;
      font-weight: 500;
      border-radius: var(--r-full);
      border: 1px solid var(--stroke-default);
      background: var(--surface-bright);
      color: var(--on-surface);
      cursor: pointer;
      transition: all 0.15s;
    }

    .lumi-btn:hover:not(:disabled) { background: var(--surface-container-high); }
    .lumi-btn-primary { background: var(--primary); color: white; border-color: transparent; }
    .lumi-btn-primary:hover:not(:disabled) { background: #1a6fe6; }
    .lumi-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="header-card">
      <div class="header-top">
        <span id="step-badge" class="step-badge">Tahap 1 / 8</span>
        <span id="score-badge" class="score-badge">Skor Diagnosis: 0/6</span>
      </div>
      <div class="progress-bar-container">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
      <h2 id="step-title" style="margin: 6px 0 0 0; font-size: 22px;">Misi Analisis Kesalahan: Fungsi Komposisi</h2>
    </div>

    <div id="content-zone">
      <!-- Dynamic step content injected here -->
    </div>

    <div class="nav-actions">
      <button id="btn-prev" class="lumi-btn" style="visibility: hidden;">Kembali</button>
      <button id="btn-next" class="lumi-btn lumi-btn-primary" disabled>Mulai Diagnosis</button>
    </div>
  </div>

  <script>
    // Data Misi: Fungsi Komposisi
    const MISSION_DATA = [
      {

        wrong_answer_html: "",
        question: "",
        options: [],
        correct_index: 0,
        explanation: ""
      },
      {
        step: 2,
        type: "quiz",
        title: "Analisis Kasus 1: Coretan Andi (Urutan Komposisi)",
        content: "**Reminder Soal:**\n$f(x) = 2x - 5$\n$g(x) = x^2 + 3x$\n$h(x) = \\sqrt{x}$",
        wrong_answer_html: "Tugas: Menentukan hasil dari $(f \\circ g)(x)$\n\nJawaban Andi:\n$(f \\circ g)(x) = (2x - 5)^2 + 3(2x - 5)$\n$= 4x^2 - 20x + 25 + 6x - 15$\n$= 4x^2 - 14x + 10$",
        question: "Andi menguraikan aljabar dengan sangat baik, namun hasil akhirnya 100% keliru. Apa miskonsepsi utama Andi?",
        options: [
          "Andi menjabarkan $(2x-5)^2$ dengan salah, seharusnya $4x^2 - 25$.",
          "Andi mensubstitusi fungsi $f(x)$ ke dalam $g(x)$, padahal notasi $(f \\circ g)(x)$ berarti mensubstitusi $g(x)$ ke dalam $f(x)$.",

        ],
        correct_index: 1,

      },
      {

        question: "Budi sudah menyusun komposisi dengan urutan yang benar. Tetapi saat membuka tanda kurung, ada sebuah kecerobohan aritmatika maut. Apa itu?",
        options: [
          "Budi mendistribusikan $3(2x - 5)$ menjadi $6x - 15$, seharusnya menjadi $6x + 15$.",
          "Hasil pangkat dua dari konstanta negatif $(-5)^2$ seharusnya bernilai positif $+25$, bukan $-25$.",
          "Penjabaran kuadrat binomial $(2x - 5)^2$ kehilangan suku tengah $-20x$, seharusnya menjadi $4x^2 - 20x + 25$."

        correct_index: 2,
        explanation: "Mata Elang! Ini adalah kesalahan \"Silly Mistake\" nomor 1 di dunia aljabar. Mengkuadratkan $(A - B)^2$ tidak sama dengan $A^2 - B^2$. Ada suku tengah $(2 \\cdot A \\cdot B)$ yang tidak boleh dilupakan. Karena suku tengah ini hilang, seluruh perhitungan Budi ke bawah jadi berantakan."
      },
      {
        step: 4,
        type: "quiz",

        content: "**Reminder Soal:**\n$f(x) = 2x - 5$\n$g(x) = x^2 + 3x$\n$h(x) = \\sqrt{x}$",
        wrong_answer_html: "Tugas: Diketahui $(f \\circ p)(x) = 2x^2 + 6x - 5$ dan $f(x) = 2x - 5$. Tentukan $p(x)$!\n\nJawaban Citra:\n$f(p(x)) = 2x^2 + 6x - 5$\n$2 \\cdot p(x) - 5 = 2x^2 + 6x - 5$\n$2 \\cdot p(x) = 2x^2 + 6x - 5 - 5$\n$2 \\cdot p(x) = 2x^2 + 6x - 10$\n$p(x) = x^2 + 3x - 5$",

          "Citra membagi seluruh persamaan dengan 2, namun lupa membagi angka $-10$ dengan 2.",
          "Konstanta $-5$ di ruas kiri saat dipindah ke ruas kanan seharusnya menjadi $+5$, sehingga saling menghilangkan (menjadi 0).",

      },
      {
        step: 5,
        type: "quiz",
        title: "Analisis Kasus 4: Coretan Doni (Mencari Fungsi Luar)",
        content: "**Reminder Soal:**\n$f(x) = 2x - 5$\n$g(x) = x^2 + 3x$\n$h(x) = \\sqrt{x}$",
        wrong_answer_html: "Tugas: Diketahui $m(x) = x + 3$ dan $(q \\circ m)(x) = x^2 + 5x + 6$. Tentukan fungsi luar $q(x)$!\n\nJawaban Doni:\n$q(m(x)) = x^2 + 5x + 6$\n$q(x+3) = x^2 + 5x + 6$\n$q(x) = (x+3)^2 + 5(x+3) + 6$\n$q(x) = x^2 + 11x + 30$",
        question: "Doni mencari \"fungsi luar\" dengan cara langsung memasukkan $(x+3)$ ke ruas kanan. Apa miskonsepsi yang merusak jawaban Doni?",
        options: [
          "Doni seharusnya mencari invers dari $(q \\circ m)(x)$ terlebih dahulu untuk menemukan $q(x)$.",

        correct_index: 1,
        explanation: "Luar Biasa! Ini adalah materi HOTS langganan ujian. Jika diketahui $q(x+3) = \\text{...}$, kita tidak boleh mengubah ruas kiri menjadi $q(x)$ lalu mensubstitusi $(x+3)$ ke kanan. Kita harus memisalkan $a = x + 3 \\implies x = a - 3$. Lalu substitusi $(a-3)$ ke persamaan. Dengan cara itu, $q(x)$ yang benar adalah $x^2 - x$."
      },
      {
        step: 6,
        type: "quiz",
        title: "Analisis Kasus 5: Coretan Eka (Evaluasi Nilai)",
        content: "**Reminder Soal:**\n$f(x) = 2x - 5$\n$g(x) = x^2 + 3x$\n$h(x) = \\sqrt{x}$",
        wrong_answer_html: "Tugas: Tentukan nilai dari $(f \\circ g)(2)$\n\nJawaban Eka:\n$f(2) = 2(2) - 5 = -1$\n$g(2) = (2)^2 + 3(2) = 4 + 6 = 10$\n$(f \\circ g)(2) = (-1) \\times 10 = -10$",
        question: "Eka mencari nilai komposisi di suatu titik. Namun cara yang digunakannya mencerminkan pemahaman yang melenceng. Mengapa?",
        options: [
          "Notasi $(f \\circ g)(2)$ bermakna substitusi berantai (menghitung $g(2)$, lalu hasilnya dimasukkan ke fungsi $f$), bukan mengalikan hasil $f(2)$ dengan $g(2)$.",
          "Eka salah menghitung nilai $g(2)$, seharusnya $2^2 + 3(2) = 8$.",
          "Evaluasi titik pada fungsi komposisi harus dikerjakan dengan mencari rumus aljabar $(f \\circ g)(x)$ terlebih dahulu, lalu diakhiri dengan memasukkan angka 2."
        ],
        correct_index: 0,
        explanation: "Tepat Sekali! Komposisi $(\\circ)$ berbeda dengan perkalian biasa $(\\cdot)$. $(f \\circ g)(2)$ berarti $f(g(2))$. Jika $g(2) = 10$, maka langkah selanjutnya adalah menghitung $f(10) = 2(10) - 5 = 15$. Jawaban yang benar adalah 15, bukan $-10$."

        content: "**Reminder Soal:**\n$f(x) = 2x - 5$\n$g(x) = x^2 + 3x$\n$h(x) = \\sqrt{x}$",
        wrong_answer_html: "Tugas: Tentukan Domain (daerah asal) dari fungsi komposisi $(h \\circ f)(x)$\n\nJawaban Fani:\n\"Fungsi luar $h(x) = \\sqrt{x}$ mewajibkan isi akar $\\geq 0$, yaitu $x \\geq 0$.\nFungsi dalam $f(x)$ adalah linear, domainnya bebas (semua Real).\nMaka domain gabungannya $(h \\circ f)(x)$ adalah irisan dari syarat keduanya, yaitu $x \\geq 0$.\"",

          "Domain dari $(h \\circ f)(x)$ seharusnya mengikuti domain fungsi linear saja, yaitu semua bilangan Real.",

      },
      {
        step: 8,
        type: "outro",
        title: "Misi Tuntas, Ahli Komposisi!",
        content: "Hebat! Kamu telah berhasil menaklukkan 6 miskonsepsi paling maut di materi Fungsi Komposisi:\n\n1. Keterbalikan arah substitusi komposisi.\n2. Lupa suku tengah saat menjabarkan bentuk kuadrat binomial.\n3. Kecerobohan tanda plus-minus saat memindah ruas.\n4. Kesalahan substitusi buta saat mencari \"fungsi luar\".\n5. Mengira simbol komposisi $(\\circ)$ sama dengan perkalian silang.\n6. Miskonsepsi cara merangkai syarat Domain fungsi komposisi.\n\n**Tantangan Terakhir:**\nSiapkan kertas burammu! Coba jabarkan hasil dari fungsi komposisi $(g \\circ f)(x)$ secara utuh dan teliti!\n*(Spoiler: Jika aljabarmu presisi, hasilnya adalah $4x^2 - 14x + 10$)*.\n\nPertahankan ketajaman analisismu, Pejuang TKA!",
        wrong_answer_html: "",
        question: "",
        options: [],
        correct_index: 0,
        explanation: ""
      }
    ];

    const state = {
      currentStep: 0,
      answers: {},
      scores: {}
    };

    function parseMarkdown(text) {
      if (!text) return "";
      let html = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    function renderProblemReminder() {
      // In this specific format, we inject the reminder directly into the content field of the JSON.
      // So this helper returns empty, maintaining compatibility with the step logic.
      return ''; 
    }

    function renderStepContent() {
      const data = MISSION_DATA[state.currentStep];
      const container = document.getElementById('content-zone');

      if (data.type === 'intro') {
        container.innerHTML = `
          <div class="math-text">${parseMarkdown(data.content)}</div>
        `;
      } else if (data.type === 'quiz') {
        const chosen = state.answers[state.currentStep];
        const isAnswered = chosen !== undefined;
        const isCorrect = isAnswered && chosen === data.correct_index;

        const optionsHTML = data.options.map((opt, idx) => {
          let cardClass = "option-card";
          if (isAnswered) {
            if (idx === data.correct_index) cardClass += " is-correct";
            else if (idx === chosen) cardClass += " is-wrong";
          } else if (idx === chosen) {
            cardClass += " is-selected";
          }

          return `
            <div class="${cardClass}" onclick="selectOption(${idx})">
              <div class="option-radio"></div>
              <div class="math-text" style="flex: 1;">${parseMarkdown(opt)}</div>
            </div>
          `;
        }).join('');

        container.innerHTML = `
          <div class="problem-box" style="margin-bottom: 16px;">
            <div class="math-text">${parseMarkdown(data.content)}</div>
          </div>
          
          <div class="scratchpad-card">
            <div class="scratchpad-title">Coretan Jawaban (Mengandung Kesalahan):</div>
            <div class="math-text">${parseMarkdown(data.wrong_answer_html)}</div>
          </div>

          <p class="math-text" style="margin: 20px 0 12px 0; font-weight: 600; font-size: 16px;">${parseMarkdown(data.question)}</p>

          <div class="options-group">
            ${optionsHTML}
          </div>

          <div class="explanation-card ${isAnswered ? 'is-visible' : ''}">
            <p class="math-text" style="margin: 0 0 6px 0; font-weight: bold; color: ${isCorrect ? 'var(--positive)' : 'var(--error)'};">
              ${isCorrect ? 'Diagnosis Tepat!' : 'Diagnosis Kurang Tepat'}
            </p>
            <p class="math-text" style="margin: 0;">${parseMarkdown(data.explanation)}</p>
          </div>
        `;
      } else if (data.type === 'outro') {
        container.innerHTML = `
          <div class="math-text">${parseMarkdown(data.content)}</div>
        `;
      }

      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "$", right: "$", display: false}
          ],
          throwOnError: false
        });
      }
    }

    function updateHeaderAndNav() {
      const totalSteps = MISSION_DATA.length;
      const currentIdx = state.currentStep;
      const data = MISSION_DATA[currentIdx];

      document.getElementById('step-badge').textContent = `Tahap ${currentIdx + 1} / ${totalSteps}`;
      document.getElementById('step-title').textContent = data.title;
      document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / totalSteps) * 100}%`;

      const totalCorrect = Object.values(state.scores).filter(Boolean).length;
      document.getElementById('score-badge').textContent = `Skor Diagnosis: ${totalCorrect}/6`;

      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');

      btnPrev.style.visibility = currentIdx > 0 ? 'visible' : 'hidden';

      if (data.type === 'intro') {
        btnNext.textContent = 'Mulai Diagnosis';
        btnNext.disabled = false;
      } else if (data.type === 'quiz') {
        const isAnswered = state.answers[currentIdx] !== undefined;
        btnNext.textContent = currentIdx === totalSteps - 2 ? 'Lihat Hasil Misi' : 'Kasus Selanjutnya';
        btnNext.disabled = !isAnswered;
      } else if (data.type === 'outro') {
        btnNext.textContent = 'Ulangi Misi';
        btnNext.disabled = false;
      }
    }

    function selectOption(optIndex) {
      const currentIdx = state.currentStep;
      if (MISSION_DATA[currentIdx].type !== 'quiz') return;
      if (state.answers[currentIdx] !== undefined) return; // Lock after answering

      state.answers[currentIdx] = optIndex;
      state.scores[currentIdx] = (optIndex === MISSION_DATA[currentIdx].correct_index);
      
      renderStepContent();
      updateHeaderAndNav();
    }

    document.getElementById('btn-prev').addEventListener('click', () => {
      if (state.currentStep > 0) {
        state.currentStep--;
        renderStepContent();
        updateHeaderAndNav();
      }
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      if (state.currentStep < MISSION_DATA.length - 1) {
        state.currentStep++;
      } else {
        // Reset state for outro "Ulangi Misi"
        state.currentStep = 0;
        state.answers = {};
        state.scores = {};
      }
      renderStepContent();
      updateHeaderAndNav();
    });

    window.addEventListener('DOMContentLoaded', () => {
      // Small delay ensures KaTeX library is fully parsed before the first render attempt
      setTimeout(() => {
          renderStepContent();
          updateHeaderAndNav();
      }, 100);
    });
  </script>
</body>
</html>
